    transition:transform 0.55s cubic-bezier(.4,.2,.2,1), opacity 0.55s ease, box-shadow 0.5s ease;
    transform-origin:bottom center;
  }
  #coverWrap.opening #cover{
    transform: rotateX(-115deg) translateY(-10px);
    opacity:0;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
  }
  #coverWrap.hidden{ display:none; }

  /* ---------- Card flip container ---------- */
  #cardWrap{
    position:absolute; left:50%; top:calc(100% * 250 / 844);
    width:calc(100% * 320 / 390); aspect-ratio:320/444;
    transform:translateX(-50%);
    display:none;
    touch-action:none;
  }
  #cardWrap.visible{ display:block; }

  #cardStage{
    position:absolute; inset:0;
    perspective:1400px;
  }

  /* one subtle page-edge peeking out, just enough to read as "a book", not a stack */
  #pageEdge{
    position:absolute; left:3%; right:3%; bottom:-7px; height:14px;
    background:#efe9da;
    border-radius:0 0 16px 16px;
    box-shadow:0 3px 6px rgba(0,0,0,0.12);
    z-index:0;
  }

  .cardFace{
    position:absolute; inset:0; z-index:1;
    border-radius:20px; overflow:hidden; background:#fff;
  }
  .cardFace .halfTop, .cardFace .halfBottom{
    position:absolute; left:0; width:100%; height:50%;
    background-size:100% 100%; background-position:center; background-repeat:no-repeat;
  }
  .cardFace .halfTop{ top:0; }
  .cardFace .halfBottom{ top:50%; }

  /* the half that does NOT move during a flip - pinned above the next card
     underneath so nothing has to be synced or "pop in" */
  .pinnedHalf{
    position:absolute; left:0; width:100%; height:50%;
    background-size:100% 100%; background-position:center; background-repeat:no-repeat;
    overflow:hidden; z-index:3;
  }
  .pinnedHalf.top{ top:0; border-radius:20px 20px 0 0; }
  .pinnedHalf.bottom{ top:50%; border-radius:0 0 20px 20px; }

  /* the half that DOES move - front shows current content, back is blank,
     revealing the next card (already sitting underneath) as it clears */
  .flipPiece{
    position:absolute; left:0; width:100%; height:50%;
    transform-style:preserve-3d; z-index:5;
    will-change:transform;
  }
  .flipPiece.bottom{ top:50%; transform-origin:top center; }
  .flipPiece.top{ top:0; transform-origin:bottom center; }
  .flipPiece .face{
    position:absolute; inset:0;
    backface-visibility:hidden; -webkit-backface-visibility:hidden;
    background-size:100% 100%; background-position:center; background-repeat:no-repeat;
    overflow:hidden;
  }
  .flipPiece.bottom .face{ border-radius:0 0 20px 20px; }
  .flipPiece.top .face{ border-radius:20px 20px 0 0; }
  .flipPiece .face.back{ background:#fff; transform:rotateX(180deg); }

  @keyframes flipFwd{ from{ transform:rotateX(0deg); } to{ transform:rotateX(-180deg); } }
  @keyframes flipBack{ from{ transform:rotateX(0deg); } to{ transform:rotateX(180deg); } }
  .flipPiece.animateFwd{ animation:flipFwd 640ms cubic-bezier(.6,.05,.7,.2) forwards; }
  .flipPiece.animateBack{ animation:flipBack 640ms cubic-bezier(.6,.05,.7,.2) forwards; }

  #cardOuterShadow{
    position:absolute; inset:0; border-radius:20px;
    box-shadow:0 24px 46px rgba(0,0,0,0.32);
    pointer-events:none; z-index:6;
  }

  #counter{
    position:absolute; left:50%; top:calc(100% * 750 / 844); transform:translateX(-50%);
    font-size:13px; color:#eaf3f0; letter-spacing:0.3px;
    text-shadow:0 1px 3px rgba(0,0,0,0.4);
    display:none;
  }
  #counter.visible{ display:block; }
  #counter b{ font-weight:700; }
</style>
</head>

<div class="frame-wrap">
  <div class="stage" id="stage">

    <div id="coverWrap">
      <div id="cover"></div>
    </div>

    <div id="cardWrap">
      <div id="pageEdge"></div>
      <div id="cardStage"></div>
      <div id="cardOuterShadow"></div>
    </div>

    <div id="counter"></div>


  </div>
</div>

  ];

  var N = cards.length;
  var current = 0;
  var locked = false;
  var DURATION = 660; // ms, keep in sync with the @keyframes animation duration

  var coverWrap = document.getElementById('coverWrap');
  var cardWrap  = document.getElementById('cardWrap');
  var cardStage = document.getElementById('cardStage');
  var counter = document.getElementById('counter');

  function bg(url){ return "url('" + url + "')"; }

  function cardFaceHTML(i, extraStyle){
    return '<div class="cardFace"' + (extraStyle || '') + '>' +
      '<div class="halfTop" style="background-image:' + bg(cards[i].top) + '"></div>' +
      '<div class="halfBottom" style="background-image:' + bg(cards[i].bottom) + '"></div>' +
    '</div>';
  }

  // renders the plain, at-rest single-card view - no flap machinery at all,
  // so there is nothing left over to get out of sync between flips
  function renderStatic(i){
    cardStage.innerHTML = cardFaceHTML(i);
  }

  function paintCounter(i){
    counter.innerHTML = '<b>' + (i+1) + '</b> of ' + N;
  }

  function openBook(){
    coverWrap.classList.add('opening');
    setTimeout(function(){
      coverWrap.classList.add('hidden');
      renderStatic(current);
      paintCounter(current);
      cardWrap.classList.add('visible');
      counter.classList.add('visible');
    }, 480);
  }

  function flip(dir){
    if (locked) return;
    var next = (current + dir + N) % N;
    locked = true;
    cardWrap.style.pointerEvents = 'none';

    // the next card is rendered fully, immediately, sitting underneath
    // everything - there is nothing to sync up later, it's just already there.
    var html = cardFaceHTML(next);

    // the half that stays put is pinned on top of it at full opacity so the
    // next card's matching half stays hidden until the swap at the very end.
    // the half that moves only ever shows its OWN current content on the
    // front and a blank back - never another card's content - so nothing
    // has to "pop in" mid-rotation.
    if (dir === 1) {
      html += '<div class="pinnedHalf top" style="background-image:' + bg(cards[current].top) + '"></div>';
      html += '<div class="flipPiece bottom" id="activeFlip">' +
                '<div class="face front" style="background-image:' + bg(cards[current].bottom) + '"></div>' +
                '<div class="face back"></div>' +
              '</div>';
    } else {
      html += '<div class="pinnedHalf bottom" style="background-image:' + bg(cards[current].bottom) + '"></div>';
      html += '<div class="flipPiece top" id="activeFlip">' +
                '<div class="face front" style="background-image:' + bg(cards[current].top) + '"></div>' +
                '<div class="face back"></div>' +
              '</div>';
    }
    cardStage.innerHTML = html;

    var flipEl = document.getElementById('activeFlip');
    requestAnimationFrame(function(){
      flipEl.classList.add(dir === 1 ? 'animateFwd' : 'animateBack');
    });

    setTimeout(function(){
      current = next;
      renderStatic(current);
      paintCounter(current);
      locked = false;
      cardWrap.style.pointerEvents = 'auto';
    }, DURATION + 20);
  }

  coverWrap.addEventListener('click', openBook);

  // swipe up / down on the card
  var startY = null;
  var startX = null;
  var activePointerId = null;
  var THRESHOLD = 24;

  cardWrap.addEventListener('pointerdown', function(e){
    if (locked) return;
    if (activePointerId !== null) return; // a pointer session is already active, ignore new ones
    activePointerId = e.pointerId;
    startY = e.clientY;
    startX = e.clientX;
    cardWrap.setPointerCapture(e.pointerId);
    e.preventDefault();
  });
  cardWrap.addEventListener('pointerup', function(e){
    if (startY === null || e.pointerId !== activePointerId) return;
    var dy = e.clientY - startY;
    var dx = e.clientX - startX;
    startY = null; startX = null; activePointerId = null;
    if (Math.abs(dy) < THRESHOLD || Math.abs(dy) < Math.abs(dx)) return;
    if (dy < 0) flip(1);
    else flip(-1);
  });
  cardWrap.addEventListener('pointercancel', function(e){
    if (e.pointerId !== activePointerId) return;
    startY = null; startX = null; activePointerId = null;
  });

})();
</script>
